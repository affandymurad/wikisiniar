<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Wikisiniar: dengarkan artikel Wikipedia dengan suara natural langsung di browser (semua browser, desktop & mobile)."
    />
    <title>Wikisiniar — Suara Natural dari Wikipedia</title>
    <script>
      // Terapkan tema sebelum halaman digambar agar tidak berkedip
      try {
        var saved = localStorage.getItem("theme") || "system";
        var dark =
          saved === "dark" ||
          (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>JavaScript is required / Diperlukan JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
